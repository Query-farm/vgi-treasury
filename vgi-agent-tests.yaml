{
  "tasks": [
    {
      "name": "datasets",
      "reference_sql": "SELECT dataset, endpoint, amount_units FROM treasury.main.datasets() ORDER BY dataset"
    },
    {
      "name": "fields",
      "reference_sql": "SELECT field_name, source_type, source_format FROM treasury.main.fields('v2/accounting/od/debt_to_penny') ORDER BY field_name"
    },
    {
      "name": "records",
      "reference_sql": "SELECT record_date, record_json FROM treasury.main.records('v2/accounting/od/debt_to_penny', start_date := '2024-01-02', end_date := '2024-01-03') ORDER BY record_date"
    },
    {
      "name": "debt_to_penny",
      "reference_sql": "SELECT record_date, tot_pub_debt_out_amt FROM treasury.main.debt_to_penny(start_date := '2024-01-02', end_date := '2024-01-03') ORDER BY record_date"
    },
    {
      "name": "operating_cash_balance",
      "reference_sql": "SELECT record_date, account_type, open_today_bal FROM treasury.main.operating_cash_balance(start_date := '2024-01-02', end_date := '2024-01-02') ORDER BY record_date, src_line_nbr"
    },
    {
      "name": "deposits_withdrawals",
      "reference_sql": "SELECT transaction_type, transaction_catg, transaction_today_amt FROM treasury.main.deposits_withdrawals(start_date := '2024-01-02', end_date := '2024-01-02') ORDER BY src_line_nbr"
    },
    {
      "name": "public_debt_transactions",
      "reference_sql": "SELECT transaction_type, security_type, transaction_today_amt FROM treasury.main.public_debt_transactions(start_date := '2024-01-02', end_date := '2024-01-02') ORDER BY src_line_nbr"
    },
    {
      "name": "monthly_statement",
      "reference_sql": "SELECT classification_desc, current_month_gross_rcpt_amt, current_month_gross_outly_amt FROM treasury.main.monthly_statement(start_date := '2024-01-31', end_date := '2024-01-31') WHERE data_type_cd='D' ORDER BY src_line_nbr"
    },
    {
      "name": "average_interest_rates",
      "reference_sql": "SELECT security_desc, avg_interest_rate_amt FROM treasury.main.average_interest_rates(start_date := '2024-01-31', end_date := '2024-01-31') ORDER BY security_desc"
    }
  ]
}
