name: Release

# Push a tag like v0.1.0 (or publish a GitHub Release). This gates on CI, builds the
# wheel + sdist, signs them, and attaches them to the release. VGI workers are not
# published to PyPI.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # In the template repositories a vX.Y.Z tag is a template version, not a worker
    # release, so only a manual run builds there. Forks release on every tag.
    if: ${{ github.event_name != 'push' || !startsWith(github.repository, 'Query-farm/vgi-starter-') }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release, attach assets
      id-token: write        # keyless signing + provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: ci/check-version.sh "${GITHUB_REF_NAME}"
      - run: uv build --sdist --wheel --out-dir dist
      - run: uvx twine check dist/*
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: for f in dist/*; do cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"; done
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
